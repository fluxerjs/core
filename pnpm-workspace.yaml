packages:
  - 'packages/*'
  - 'examples'
  - 'apps/*'

# pnpm 11 blocks dependency install scripts unless listed here.
allowBuilds:
  esbuild: true
  '@discordjs/opus': false
  node-webcodecs: false
  youtube-dl-exec: false

ignoredOptionalDependencies:
  - sharp

overrides:
  tar: '>=7.5.21'
  minimatch: '>=10.2.3'
  ws: '>=8.21.0'
  brace-expansion: '>=5.0.7'
  postcss: '>=8.5.18'
  'picomatch@^2.0.0': '2.3.2'
  'picomatch@^4.0.0': '4.0.5'
  'rollup@^4.0.0': '4.62.2'
  'vite@^7.0.0': '7.3.5'
  js-yaml: '>=3.15.0 <4'
  yaml: '>=2.8.3'
